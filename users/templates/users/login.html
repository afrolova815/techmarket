{% extends 'base.html' %}

{% block title %}Авторизация{% endblock %}

{% block content %}
<div class="page-header">
    <h2 class="page-title">Авторизация</h2>
</div>

<form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}" />
    <div class="form-error">{{ form.non_field_errors }}</div>
    {% for f in form %}
        <p>
            <label class="label" for="{{ f.id_for_label }}">{{ f.label }}: </label>
            {{ f }}
        </p>
        <div class="form-error">{{ f.errors }}</div>
    {% endfor %}
    <p><button class="product-link" type="submit">Войти</button></p>
    <p><a href="{% url 'users:password_reset' %}">Забыли пароль?</a></p>
</form>
{% endblock %}
